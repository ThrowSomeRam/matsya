[project]
name = "matsya-contracts"
version = "0.1.0"
description = "Shared table contracts and fixtures for the matsya cash-flow engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "polars>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matsya_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
