# ---------------------------------------------------------------
# 3. MODEL CONSTANTS
# ---------------------------------------------------------------

simulation:          # B6
  n_paths: {value: 10000, status: logic, why: "SE of p_short = sqrt(p(1-p)/N) ~ 0.002 at p=0.05"}
  horizon_days: {value: 90, status: assumption, why: "covers 45-day statutory max plus typical delays"}
  seed: {rule: "derived from run_id", status: logic}

decision:            # B9
  milp_path_subsample: {value: 1000, status: logic, why: "SE ~ 0.007 at p=0.05, so re-check chosen plan on all 10,000 paths (mandatory)"}
  shortfall_target_eps: {status: decide, note: "owner-set; pick a labelled default"}
  relationship_penalty: {status: decide, note: "owner-set; ask a few MSME owners"}

payment_timing:      # B4
  time_step: {value: week, status: assumption, test: "compare C-index vs daily model on Kaggle"}
  week_origin: {value: issue_date, status: assumption, why: "T >= 1 always; terms_days as covariate"}
  never_paid_cutoff_days: {value: 365, status: assumption, note: "proposed, not yet agreed"}
  prior_strength: {value: 8, status: tune, method: "empirical Bayes per sector; check on synthetic first 3-5 invoices"}
  pi_prior: {status: tune, note: "derive stock-to-flow correction from steady-state equation; keep wide. Weakest number."}
  gibbs_sweeps: {value: 50, status: tune, check: "R-hat < 1.01 across chains on synthetic data", note: "burn-in; 20 gave max R-hat 1.021 for pi"}
  gibbs_draws: {value: 400, status: tune, note: "kept draws after burn-in"}

flows:               # B5
  quantiles: [0.05, 0.25, 0.50, 0.75, 0.95]
  quantile_crossing_fix: sort_per_day
  chronos_fallback_below_weeks: {value: 8, status: tune, method: "Berka backtest at 2..16 weeks, CRPS crossover"}

calibration:         # B7
  target_coverage: {value: 0.80, status: assumption}
  adapt_max_horizon_days:
    value: 30
    status: decided
    why: >
      ACI adapts horizons 1-30 only; 60 and 90 use the engine's own band (level fixed at
      alpha). Delayed feedback: a horizon-h band is scored h days after issue, so at 60-90
      days misses arrive in long correlated runs about events already over, and ACI keeps
      widening and narrowing against them. On the replay benchmark the uncalibrated band
      covered 0.82 / 0.80 at 60 / 90 days and every ACI step size made it worse.
  aci_gamma:
    status: tune
    paper_value: 0.005   # Gibbs & Candes 2021, chosen for long series
    grid: [0.005, 0.01, 0.02, 0.05, 0.1]
    note: >
      At ~90 daily outcomes per tenant, gamma=0.005 barely adapts
      (coverage bound ~ (1+gamma)/(gamma*N) is vacuous). Tune on the Berka
      shock replay or use the online step-size version (Gibbs & Candes 2022).
      Horizon-h intervals get feedback only after h days.
    online:            # Gibbs & Candes 2022 (DtACI): one expert per grid gamma, exponential weights
      horizon_T: {value: 365, status: assumption, why: "sets eta and sigma by the paper's formulas; about a year of daily outcomes per horizon"}
      sigma: "1 / (2 T)"
      eta: "sqrt(3 / T) * sqrt((log(K T) + 2) / ((1 - alpha)^2 alpha^3))"
    sources:
      - https://arxiv.org/pdf/2106.00170
      - https://arxiv.org/pdf/2208.08401

shocks:              # B8
  kalman_rho: {status: tune, method: "MLE on sector lateness residuals; must recover planted value on synthetic"}
  kalman_noise_scales: {status: tune, method: "MLE"}
  bocpd_hazard: {status: tune, method: "detection-delay vs false-alarm curve on injected shifts"}

privacy_gate:        # A8, listed for reference
  k_min_suppliers: {status: decide}
  laplace_epsilon: {status: decide}
