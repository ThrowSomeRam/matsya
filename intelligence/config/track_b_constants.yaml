treds:
  status: verified
  onboarding_mandate:
    companies_turnover_above_paise: 2500000000000   # Rs 250 crore (S.O. 4845(E), 7 Nov 2024; was Rs 500 crore)
    all_cpses: true
  cpse_settlement_mandate:
