# Track B constants and backed-up facts
# Fact-checked: 2026-10-24
# status values:
#   verified     - checked against a source on the date above
#   logic        - follows from a derivation, not from data
#   assumption   - our choice; justify or tune before relying on it
#   tune         - set by an experiment, value here is only the starting point
#   decide       - not set yet, needs a decision
#   verify       - stated from general knowledge, not checked yet

# ---------------------------------------------------------------
# 1. LEGAL AND STATUTORY (India)
# ---------------------------------------------------------------

rbi_bank_rate:
  status: verified
  note: >
    MSMED interest uses the bank rate in force at EACH monthly rest
    (Calcutta HC, 2024). Store as a dated series, not one constant.
  history:   # effective_from: annual rate (decimal)
    - {effective_from: "2026-10-07", rate: 0.0575, src: "RBI MPC, 7 Oct 2026 (repo 5.25 -> 5.50, MSF/Bank Rate -> 5.75)"}
    - {effective_from: "TODO", rate: 0.0550, src: "RBI current-rates page, Jun-Aug 2026"}
  todo: "Backfill full bank-rate history from RBI for any delay older than Oct 2026."
  sources:
    - https://www.scconline.com/blog/post/2026/10/09/rbi-hikes-repo-rate-to-5-50-percent-october-2026/
    - https://www.taxtmi.com/rss_feed_blog?id=763883

msmed_act:
  status: verified
  section_15:
    max_payment_days_with_agreement: 45
    payment_days_without_agreement: 15
    unknown_terms_default_days: {value: 45, status: decide, why: "terms_source unknown: assume the s.15 maximum (an agreement may exist that we have not seen), the late end of the legal range"}
    clock_starts: "acceptance or deemed acceptance of goods/services"
  section_16:
    rate_multiplier: 3            # x RBI bank rate
    compounding: monthly_rests
    overrides_agreements: true
    interest_starts: "appointed day, or day after agreed date if earlier"
  formula: "I = P * (prod_k (1 + 3*r_k/12) - 1), r_k = bank rate at month k"
  applies_to: [micro, small]      # supplier must be Udyam-registered
  sources:
    - https://taxmann.com/post/blog/a-study-of-provisions-of-the-msmed-act-related-disclosure-under-schedule-iii-of-companies-act
    - https://www.dcmsme.gov.in/publications/LegalFramework.pdf

section_43b_h:
  status: verified
  old_ref: "Income-tax Act 1961, s.43B(h)"
  new_ref: "Income-tax Act 2025, s.37(2)(g) (from 1 Apr 2026)"
  covers: [micro, small]          # medium excluded
  effect: "buyer's deduction allowed only on actual payment if paid after MSMED s.15 limit"
  sources:
    - https://busy.in/tds/section-43bh-msme-payment-rule-and-45-day-limit-explained/

tds:
  status: verified
  note: >
    Income-tax Act 2025 in force from 1 Apr 2026. Old 194-series sections
    are now Section 393(1) table entries. Rates unchanged. Use the old
    section for payments/credits up to 31 Mar 2026, new one after.
  matcher_candidate_rates: [0.0, 0.001, 0.01, 0.02, 0.10]   # 0.0 added: below-threshold invoices carry no TDS
  rates:
    contractor_individual_huf: {rate: 0.01, old: "194C", new: "393(1) Table Sl.6(i)"}
    contractor_other:          {rate: 0.02, old: "194C", new: "393(1) Table Sl.6(i)"}
    professional_fees:         {rate: 0.10, old: "194J", new: "393(1) Table Sl.6"}
    technical_fees:            {rate: 0.02, old: "194J", new: "393(1) Table Sl.6"}
    purchase_of_goods:
      rate: 0.001
      old: "194Q"
      new: "393(1) Table Sl.8(ii)"
      condition: "buyer turnover > Rs 10 crore AND purchases from that seller > Rs 50 lakh in the year"
  thresholds_status: verify   # contractor and 194J thresholds under the 2025 Act not re-checked
  sources:
    - https://blog.tdsman.com/2026/05/tds-on-payments-to-contractors-section-3931-section-194c/
    - https://www.taxheal.com/?p=120666
    - https://corpready.in/articles/207-tds-compliance-guide

statutory_calendar:
  status: verified
  monthly:
    tds_deposit:      {day: 7, exception: "March TDS due 30 April"}
    pf_deposit:       {day: 15}
    esi_deposit:      {day: 15}
    gstr3b_monthly:   {day: 20}
  quarterly:
