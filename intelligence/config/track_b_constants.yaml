    - "PF/ESI treated as hard deadlines; model as due on the 15th."
  sources:
    - https://treelife.in/?p=16782
    - https://treelife.in/?p=16358

e_invoicing:
  status: verified
  threshold_aato_paise: 5000000000   # Rs 5 crore
  rule: "mandatory if aggregate turnover exceeded Rs 5 crore in ANY FY since 2017-18; stays on after"
