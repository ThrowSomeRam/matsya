[project]
name = "matsya-intelligence"
version = "0.0.1"
description = "Track B intelligence plane for the matsya cash-flow engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pyyaml>=6",
    "scikit-learn>=1.4",
    "matsya-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Benchmarks on foreign datasets only (eval/models); never used by production components.
bench = ["scikit-survival>=0.23", "lightgbm>=4.3", "pymysql>=1.1"]

[tool.uv.sources]
matsya-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matsya_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running statistical checks (deselect with -m 'not slow')"]
