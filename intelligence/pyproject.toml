[project]
name = "matsya-intelligence"
version = "0.0.1"
description = "Track B intelligence plane for the matsya cash-flow engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matsya_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
