[project]
name = "matsya-platform"
version = "0.0.1"
description = "Track A platform plane for the matsya cash-flow engine"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.7",
    "duckdb>=1.0",  # local queries over the Parquet table store
    "cryptography>=42",  # A3: AES-256-GCM payloads, RFC 3394 key wrap
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matsya_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
