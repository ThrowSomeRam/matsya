[project]
name = "matsya-eval-platform"
version = "0.0.1"
description = "Track A infrastructure evaluation: renderers and the end-to-end scoring loop"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["render"]

[tool.pytest.ini_options]
testpaths = ["tests"]
